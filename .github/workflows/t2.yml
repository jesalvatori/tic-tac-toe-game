name: T2 tests
on:
  pull_request:
    paths: ['app_t2.py', 't2/**', 'tests/**', 'scripts/check_t2_ui.py', 'requirements-t2.txt', '.github/workflows/t2.yml']
  push:
    branches: ['t2-rede-genetica']
    paths: ['app_t2.py', 't2/**', 'tests/**', 'scripts/check_t2_ui.py', 'requirements-t2.txt', '.github/workflows/t2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-t2.txt playwright
      - run: python -m unittest discover -s tests -v
      - run: node --check t2/front_end/script.js
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_t2_ui.py
