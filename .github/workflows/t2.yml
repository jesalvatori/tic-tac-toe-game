name: T2 tests
on:
  pull_request:
    paths: ['t2/**', '.github/workflows/t2.yml']
  push:
    branches: ['t2-rede-genetica']
    paths: ['t2/**', '.github/workflows/t2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r t2/requirements.txt playwright
      - run: python -m unittest discover -s t2/tests -v
      - run: node --check t2/front_end/script.js
      - run: python -m playwright install --with-deps chromium
      - run: python t2/scripts/check_t2_ui.py
